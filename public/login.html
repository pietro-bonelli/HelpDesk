<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Helpdesk | Login</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages/login.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" /></head>
    
    <script src="js/toast.js"></script>
    <script src="js/global.js"></script>
    <script src="js/header.js"></script>
    <script src="js/login.js"></script>
</head>
<body>
    <header class="header">
        <h3 class="logo"><a href="index.html">HelpDesk</a></h3>
        <nav class="menu menu-closed">
            <ul>
                <li><a href="index.html" class="btn-ghost btn-sm btn-ghost-selected">Home</a></li>
                <li><a href="index.html#features" class="btn-ghost btn-sm">Funzionalità</a></li>
                <li><a href="index.html#faq" class="btn-ghost btn-sm">FAQ</a></li>
                <li><a href="index.html#contacts" class="btn-ghost btn-sm">Contatti</a></li>
            </ul>

            <div class="user-section">
                <a href="login.html" class="btn-ghost btn-md" id="login">Login</a>
                <a href="login.html?register=1" class="btn-primary btn-md" id="register">Registrati</a>
                <a href="/dashboard" class="btn-primary btn-md" id="dashboard">I Tuoi Ticket</a>
                <div class="user-profile" id="user-profile">
                    <div class="user-profile-button" id="user-profile-button">
                        <p class="" id="user-profile-avatar"></p>
                        <p id="user-profile-display"></p>
                        <i class="fa-solid fa-angle-down icon"></i>
                    </div>
                    <div class="user-section-dropdown closed" id="user-section-dropdown">
                        <p class="label-upper">Informazioni Personali</p>
                        <p class="small" id="user-profile-email">pietro.bonelli2004@gmail.com</p>
                        <p class="role-badge" id="user-profile-role"><i class="fa-solid fa-circle"></i></p>
                        <hr>
                        <nav class="nav-light">
                            <p class="label-upper nav-label">TEST</p>
                            <button id="logout" class="nav-item"><i class="icon fa-solid fa-arrow-right-from-bracket"></i>Logout</button>
                        </nav>
                    </div>
                </div>
            </div>
        </nav>
        <p class="burger-menu dropdown-menu-btn" id="burger-menu"><i class="fa-solid fa-bars"></i></p>
    </header>

    <main id="login-card">
        <h1 id="card-title-login">Bentornato</h1>
        <h1 id="card-title-register">Benvenuto</h1>
        <p class="small" id="card-text-login">Accedi al tuo account per gestire i ticket.</p>
        <p class="small" id="card-text-register">Registrati per inviare il tuo primo ticket.</p>

        <div class="slider">
            <div class="slider-background-wrapper"><div class="slider-background"></div></div>
            <div class="slider-text">
                <button id="slider-accedi">Accedi</button>
                <button id="slider-registrati">Registrati</button>
            </div>
        </div>

        <form id="form-login" data-loading>
            <label for="email">Email</label>
            <input type="email" placeholder="name@example.com" name="email" required>
            <label for="password">Password</label>
            <input type="password" placeholder="•••••••" name="password" required>

            <button type="submit">Accedi</button>
        </form>

        <form id="form-register" data-loading>
            <label for="fist_name">Nome</label>
            <input type="text" placeholder="Mario" name="first_name" required>
            <label for="last_name">Cognome</label>
            <input type="text" placeholder="Rossi" name="last_name" required>

            <label for="email">Email</label>
            <input type="email" placeholder="test@example.com" name="email" required>

            <label for="password">Password</label>
            <input type="password" placeholder="•••••••" name="password" required>
            <label for="password">Conferma Password</label>
            <input type="password" placeholder="•••••••" name="conferma-password" required>

            <button type="submit" id="submit-register">Registrati</button>
        </form>

        <div class="error-message" id="error-message-container">
            <i class="fa-regular fa-circle-xmark error-message-icon"></i>
            <p id="error-message">Test messaggio di errore</p>
        </div>
    </main>
</body>
</html>
